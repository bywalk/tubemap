name: Compile Contributions to Main Data

on:
  push:
    branches:
      - main
    paths:
      - 'contributions/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  compile-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run Contributions Compiler
        run: |
          python scripts/build_data.py

      - name: Commit and Push Compiled Data
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git add js/data/videos_recent.js channels.json
          if git diff --staged --quiet; then
            echo "No compiled data changes to commit."
          else
            git commit -m "chore(data): auto-compile contributions into videos_recent.js [skip ci]"
            git push
          fi
