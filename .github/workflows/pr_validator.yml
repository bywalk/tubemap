name: PR Data AI Validator

on:
  pull_request_target:
    types: [opened, synchronize, reopened]
    paths:
      - 'contributions/**'
      - 'js/data/**'
      - 'channels.json'
      - 'scripts/**'
      - '.github/workflows/**'

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  validate-pr:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Base Repository (Safe Environment)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.base_ref }}
          fetch-depth: 0

      - name: Fetch PR Head Commit
        run: |
          git fetch origin ${{ github.event.pull_request.head.sha }}:pr-head

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run AI Data Validation
        id: validator
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python scripts/validate_pr.py origin/${{ github.base_ref }} pr-head

      - name: Read Report
        id: report
        run: |
          REPORT=$(cat pr_report.md)
          echo "REPORT<<EOF" >> $GITHUB_ENV
          cat pr_report.md >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: Comment on PR
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const report = fs.readFileSync('pr_report.md', 'utf8');
            const prNumber = context.payload.pull_request.number;
            
            // 기존 봇 코멘트 확인 후 업데이트 또는 신규 작성
            const comments = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber
            });
            
            const botComment = comments.data.find(c => c.body.includes('TubeMap AI 데이터 검증 리포트'));
            
            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: report
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body: report
              });
            }

      - name: Update PR Labels
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const prNumber = context.payload.pull_request.number;
            const labelToAdd = "${{ steps.validator.outputs.label }}" || "needs-review";
            const oppositeLabel = labelToAdd === "ai-verified" ? "needs-review" : "ai-verified";
            
            try {
              // 이전 반대 라벨이 있으면 제거
              await github.rest.issues.removeLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                name: oppositeLabel
              });
            } catch (e) {
              // 라벨이 없었으면 무시
            }
            
            // 신규 라벨 부착
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              labels: [labelToAdd]
            });
